<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <rect width="800" height="350" fill="#FAFAFA" rx="12"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A73E8" text-anchor="middle" direction="rtl">העברה ממכשיר למכשיר</text>

  <rect x="30" y="60" width="200" height="200" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="130" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="middle" direction="rtl">מכשיר שולח</text>

  <rect x="50" y="110" width="160" height="35" rx="6" fill="#C8E6C9"/>
  <text x="130" y="133" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle" direction="rtl">1. בניית תמונה</text>

  <rect x="50" y="155" width="160" height="35" rx="6" fill="#C8E6C9"/>
  <text x="130" y="178" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle" direction="rtl">2. הצפנת AES-GCM</text>

  <rect x="50" y="200" width="160" height="35" rx="6" fill="#C8E6C9"/>
  <text x="130" y="223" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle" direction="rtl">3. שליחה דרך Bluetooth</text>

  <rect x="290" y="120" width="220" height="100" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#E65100" text-anchor="middle" direction="rtl">Google Nearby</text>
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" direction="rtl">BLE + Wi-Fi Direct</text>
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="11" fill="#888" text-anchor="middle" direction="rtl">ללא צורך באינטרנט</text>

  <line x1="230" y1="170" x2="290" y2="170" stroke="#999" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="510" y1="170" x2="570" y2="170" stroke="#999" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="570" y="60" width="200" height="200" rx="12" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="670" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565C0" text-anchor="middle" direction="rtl">מכשיר מקבל</text>

  <rect x="590" y="110" width="160" height="35" rx="6" fill="#BBDEFB"/>
  <text x="670" y="133" font-family="Arial, sans-serif" font-size="12" fill="#1565C0" text-anchor="middle" direction="rtl">4. קבלת קובץ</text>

  <rect x="590" y="155" width="160" height="35" rx="6" fill="#BBDEFB"/>
  <text x="670" y="178" font-family="Arial, sans-serif" font-size="12" fill="#1565C0" text-anchor="middle" direction="rtl">5. פענוח</text>

  <rect x="590" y="200" width="160" height="35" rx="6" fill="#BBDEFB"/>
  <text x="670" y="223" font-family="Arial, sans-serif" font-size="12" fill="#1565C0" text-anchor="middle" direction="rtl">6. ייבוא נתונים</text>

  <rect x="30" y="290" width="740" height="40" rx="8" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" direction="rtl">ההעברה מוצפת ומקומית. ללא צורך באינטרנט או שרת. פועלת דרך Bluetooth ו-Wi-Fi Direct.</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
</svg>
