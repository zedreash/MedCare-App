<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#FAFAFA" rx="12"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A73E8" text-anchor="middle" direction="rtl">נתיב הצפנה</text>

  <rect x="30" y="60" width="150" height="70" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="105" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="middle" direction="rtl">נתוני משתמש</text>
  <text x="105" y="112" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" direction="rtl">חולים + תורים + קבצים</text>

  <line x1="180" y1="95" x2="220" y2="95" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="60" width="150" height="70" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="295" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle" direction="rtl">ייצוא נתונים</text>
  <text x="295" y="112" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" direction="rtl">DataTransfer.buildSnapshot()</text>

  <line x1="370" y1="95" x2="410" y2="95" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="410" y="60" width="130" height="70" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="475" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle" direction="rtl">JSON</text>
  <text x="475" y="112" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" direction="rtl">תמונת חשבון מלאה</text>

  <line x1="540" y1="95" x2="580" y2="95" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="60" width="180" height="70" rx="8" fill="#FCE4EC" stroke="#E91E63" stroke-width="1.5"/>
  <text x="670" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#AD1457" text-anchor="middle" direction="rtl">הצפנה</text>
  <text x="670" y="105" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" direction="rtl">AES-256-GCM</text>
  <text x="670" y="122" font-family="Arial, sans-serif" font-size="11" fill="#888" text-anchor="middle" direction="rtl">PBKDF2 + סיסמה</text>

  <rect x="580" y="180" width="180" height="70" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="670" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A" text-anchor="middle" direction="rtl">קובץ .medcare</text>
  <text x="670" y="232" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" direction="rtl">MAGIC + גרסה + אימייל + מוצפן</text>

  <line x1="670" y1="130" x2="670" y2="180" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="30" y="200" width="200" height="80" rx="8" fill="#E0F7FA" stroke="#00BCD4" stroke-width="1.5"/>
  <text x="130" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#006064" text-anchor="middle" direction="rtl">אפשרויות אחסון</text>
  <text x="130" y="255" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" direction="rtl">גיבוי + ייצוא + העברה</text>

  <line x1="580" y1="215" x2="230" y2="235" stroke="#999" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6,4"/>

  <rect x="30" y="310" width="740" height="60" rx="8" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  <text x="400" y="338" font-family="Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" direction="rtl">כל דבר נשאר על המכשיר. שום דבר אינו נשלח לשרת חיצוני.</text>
  <text x="400" y="358" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle" direction="rtl">SQLCipher הצפנת מסד נתונים + AES-GCM הצפנת גיבוי + נעילה ביומטרית</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
</svg>
