plugins {
    id 'com.android.application'
}

def secretsFile = rootProject.file('secrets.properties')
def mapsApiKey = ""
def signingProps = new Properties()
if (secretsFile.exists()) {
    def properties = new Properties()
    properties.load(secretsFile.newDataInputStream())
    mapsApiKey = properties['MAPS_API_KEY'] ?: ""
    signingProps.load(secretsFile.newDataInputStream())
}

android {
    namespace 'com.medcare.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.medcare.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [googleMapsApiKey: mapsApiKey]
    }

    signingConfigs {
        release {
            storeFile file(signingProps['KEYSTORE_FILE'] ?: '../medcare-release.jks')
            storePassword signingProps['KEYSTORE_PASSWORD'] ?: ''
            keyAlias 'medcare'
            keyPassword signingProps['KEY_PASSWORD'] ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Biometric
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // Material Design
    implementation 'com.google.android.material:material:1.11.0'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // SQLCipher (DB at-rest encryption)
    implementation 'net.zetetic:sqlcipher-android:4.8.0'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    // WorkManager (scheduled backups & reminders)
    implementation 'androidx.work:work-runtime:2.9.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'

    // Google Maps, Places & Location
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.libraries.places:places:3.3.0'

    // Nearby Connections (device-to-device transfer)
    implementation 'com.google.android.gms:play-services-nearby:19.0.0'

    // Gson (for JSON serialization)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Preferences (for auth session)
    implementation 'androidx.preference:preference:1.2.1'
}
